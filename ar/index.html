<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>TurisAR - 7 Maravillas</title>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://cdn.rawgit.com/AR-js-org/AR.js/3.3.2/aframe/build/aframe-ar.min.js"></script>
    <style>
      .info-panel {
        position: absolute;
        top: 10px;
        left: 10px;
        background: rgba(255, 255, 255, 0.95);
        padding: 10px;
        border-radius: 10px;
        max-width: 300px;
        display: none;
      }
      .info-panel.active {
        display: block;
      }
      .info-panel img {
        width: 100%;
        border-radius: 8px;
      }
      .info-panel a {
        display: block;
        margin-top: 5px;
        color: #007bff;
      }
    </style>
  </head>

  <body style="margin: 0; overflow: hidden">
    <a-scene embedded arjs vr-mode-ui="enabled: false" id="scene">
      <a-entity camera></a-entity>
    </a-scene>

    <!-- Contenedor donde se inyectarán los paneles -->
    <div id="info-panels-container"></div>

    <script>
      // Leer JSON del localStorage
      const maravillas = JSON.parse(localStorage.getItem('lugares')) || [];

      const scene = document.getElementById('scene');
      const panelsContainer = document.getElementById('info-panels-container');

      maravillas.forEach((maravilla, index) => {
        const id = `m${index + 1}`;

        // Crear marcador
        const marker = document.createElement('a-marker');
        marker.setAttribute('type', 'pattern');
        marker.setAttribute('url', maravilla.marker);
        marker.setAttribute('id', id);

        // Figura simple, puede ser cambiada dependiendo de que se quiera
        const shape = document.createElement('a-box');
        shape.setAttribute('position', '0 0.5 0');
        shape.setAttribute('color', '#FFC107');
        marker.appendChild(shape);
        scene.appendChild(marker);

        // Crear panel de info
        const panel = document.createElement('div');
        panel.className = 'info-panel';
        panel.id = `info-${id}`;
        panel.innerHTML = `
          <h3>${maravilla.nombre}</h3>
          <img src="${maravilla.imagen}" />
          <p>${maravilla.ficha}</p>
          <a href="${maravilla.web}" target="_blank">Más información</a>
          <a href="${maravilla.mapa}" target="_blank">Ver en Google Maps</a>
        `;
        panelsContainer.appendChild(panel);

        // Mostrar/ocultar panel al detectar marcador
        marker.addEventListener('markerFound', () => panel.classList.add('active'));
        marker.addEventListener('markerLost', () => panel.classList.remove('active'));
      });
    </script>
  </body>
</html>
